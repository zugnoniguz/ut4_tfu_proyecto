worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_conn_zone $binary_remote_addr zone=movies_conn:10m;
    limit_req_zone  $binary_remote_addr zone=movies_req:10m  rate=2r/s;

    limit_conn_status 429;
    limit_req_status  429;
    limit_conn_log_level warn;
    limit_req_log_level warn;

    upstream stats_backend   { zone stats_lb 64k;   server stats:8000   resolve; }
    upstream reviews_backend { zone reviews_lb 64k; server reviews:8000 resolve; }
    upstream users_backend   { zone users_lb 64k;   server users:8000   resolve; }

    server {
        listen 8080;
        keepalive_timeout 0;

        location = /gateway/health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","gateway":"nginx","lb":"round-robin (dns resolve)","services":["stats","reviews","users"]}';
        }

        location = /gateway/stats {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"lb":"round-robin+resolve","upstreams":["stats_backend","reviews_backend","users_backend"],"filters":{"stats_queue":"rate=2r/s burst=6"}}';
        }

        location = / {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"gateway":"movies-lb","endpoints":["/gateway/health","/health","/movies/<id>/stats","/movies/<id>/reviews","/reviews/<id>","/users/<id>"]}';
        }

        location = /health {
            proxy_pass http://stats_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Upstream $upstream_addr always;
        }

        location ~ ^/movies/[0-9]+/stats$ {
            limit_req zone=movies_req burst=6 nodelay;

            proxy_pass http://stats_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway "nginx";

            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;

            add_header X-Upstream $upstream_addr always;
            add_header Retry-After 2 always;
            add_header X-Queue-Filter "movies" always;

            error_page 429 = @limit_429;
        }

        location ~ ^/movies/[0-9]+/reviews(/[0-9]+)?$ {
            proxy_pass http://reviews_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location ~ ^/reviews/[0-9]+$ {
            proxy_pass http://reviews_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location ~ ^/users/[0-9]+/reviews$ {
            proxy_pass http://reviews_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location ~ ^/users/[0-9]+$ {
            proxy_pass http://users_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location @limit_429 {
            add_header Content-Type application/json always;
            add_header Retry-After 2 always;
            return 429 '{"detail":"Too many requests – nginx bounded queue full (rate=2r/s burst=6, filter=stats)","error":"limit_req exceeded"}';
        }

        location / {
            access_log off;
            add_header Content-Type application/json always;
            return 404 '{"detail":"No route for this path in the load balancer","gateway":"movies-lb","endpoints":["/gateway/health","/health","/movies/<id>/stats","/movies/<id>/reviews","/reviews/<id>","/users/<id>","/users/<id>/reviews"]}';
        }
    }
}