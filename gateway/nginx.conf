worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone  $binary_remote_addr zone=stats_req:10m  rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=api_req:10m    rate=10r/s;

    limit_conn_status 429;
    limit_req_status  429;
    limit_conn_log_level warn;
    limit_req_log_level warn;

    upstream stats_backend   { zone stats_lb 64k;   server stats:8000   resolve; }
    upstream reviews_backend { zone reviews_lb 64k; server reviews:8000 resolve; }
    upstream users_backend   { zone users_lb 64k;   server users:8000   resolve; }

    server {
        listen 8080;
        keepalive_timeout 0;

        location = /gateway/health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","gateway":"nginx","lb":"round-robin (dns resolve)","services":["stats","reviews","users"],"routes":["/api/stats/*","/api/reviews/*","/api/users/*"]}';
        }

        location = /gateway/stats {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"lb":"round-robin+resolve","upstreams":["stats_backend","reviews_backend","users_backend"],"routes":{"/api/stats/":"stats_backend","/api/reviews/":"reviews_backend","/api/users/":"users_backend"},"filters":{"stats_queue":"rate=2r/s burst=6"}}';
        }

        location = / {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"gateway":"movies-lb","routes":["/api/stats/*","/api/reviews/*","/api/users/*"],"examples":["/api/stats/movies/<id>/stats","/api/reviews/movies/<id>/reviews","/api/reviews/reviews/<id>","/api/reviews/users/<id>/reviews","/api/users/users/<id>"]}';
        }

        location = /api/stats {
            proxy_pass http://stats_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream $upstream_addr always;
        }

        location /api/stats/ {
            limit_req zone=stats_req burst=6 nodelay;

            proxy_pass http://stats_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway "nginx";

            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;

            add_header X-Upstream $upstream_addr always;
            add_header Retry-After 2 always;
            add_header X-Queue-Filter "stats" always;

            error_page 429 = @limit_429;
        }

        location = /api/reviews {
            proxy_pass http://reviews_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream $upstream_addr always;
        }

        location /api/reviews/ {
            limit_req zone=api_req burst=20 nodelay;
            error_page 429 = @api_limit_429;

            proxy_pass http://reviews_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location = /api/users {
            proxy_pass http://users_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream $upstream_addr always;
        }

        location /api/users/ {
            limit_req zone=api_req burst=20 nodelay;
            error_page 429 = @api_limit_429;

            proxy_pass http://users_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            add_header X-Upstream $upstream_addr always;
        }

        location @limit_429 {
            add_header Content-Type application/json always;
            add_header Retry-After 2 always;
            return 429 '{"detail":"Too many requests – nginx bounded queue full (rate=2r/s burst=6, filter=stats)","error":"limit_req exceeded"}';
        }

        location @api_limit_429 {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"detail":"Too many requests - limite por IP (rate=10r/s burst=20)","error":"limit_req exceeded"}';
        }

        location / {
            access_log off;
            add_header Content-Type application/json always;
            return 404 '{"detail":"No route for this path in the load balancer","gateway":"movies-lb","routes":["/api/stats/*","/api/reviews/*","/api/users/*"]}';
        }
    }
}