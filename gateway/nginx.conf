worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --- Bounded queue zones ---
    # Use $binary_remote_addr so all requests from same test client share one bucket.
    # For truly global (all IPs) you could use $server_name with `server_name localhost;` but $binary_remote_addr
    # is more predictable when server_name is unset. In production with many clients, use a global key like $host.
    limit_conn_zone $binary_remote_addr zone=movies_conn:10m;
    # rate=2r/s + burst=5 => 2 concurrent per second + 5 queued = 7 total (pre-built approximation)
    # nodelay => burst is processed immediately; without nodelay nginx would delay queued requests to conform to rate.
    # For true bounded queue with timeout use nginx Plus: `queue 5 timeout=10s` in upstream (see below).
    limit_req_zone $binary_remote_addr zone=movies_req:10m rate=2r/s;

    limit_conn_status 429;
    limit_req_status 429;
    limit_conn_log_level warn;
    limit_req_log_level warn;

    upstream app_backend {
        server app:8000 max_fails=0;
    }

    server {
        listen 8080;
        # Disable keepalive so each request = new TCP connection → limit_conn counts per-request correctly
        keepalive_timeout 0;

        # --- Gateway own endpoints (no limits, no proxy) ---
        location = /gateway/health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","gateway":"nginx","filter_prefix":"/movies","max_concurrent":2,"max_queue":5,"queue":"burst-as-queue (Plus: queue 5 timeout=10s)"}';
        }

        location = /gateway/stats {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"max_concurrent":2,"max_queue":5,"note":"nginx open-source approximates queue via burst=5; nginx Plus would use: queue 5 timeout=10s inside upstream"}';
        }

        location ^~ /movies {
            limit_req zone=movies_req burst=6 nodelay;

            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway "nginx";

            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;

            add_header Retry-After 2 always;
            add_header X-Queue-Filter "movies" always;

            error_page 429 = @limit_429;
        }

        location = /movies {
            limit_req zone=movies_req burst=6 nodelay;
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Retry-After 2 always;
            error_page 429 = @limit_429;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
        }

        location @limit_429 {
            add_header Content-Type application/json always;
            add_header Retry-After 2 always;
            return 429 '{"detail":"Too many requests – nginx bounded queue full (max_concurrent=2, max_queue=5, filter=/movies)","error":"limit_conn or limit_req exceeded"}';
        }
    }
}
