[project]
name = "stats-adapter"
version = "0.1.0"
description = "Adaptador REST -> SOAP: expone las estadísticas de Stats con el JSON de la UT4"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build]
module-name = "stats_adapter"
module-root = "src"
