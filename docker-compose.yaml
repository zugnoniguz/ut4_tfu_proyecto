services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
      POSTGRES_DB: movies
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - movies-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  redis:
    image: redis:7-alpine
    networks:
      - movies-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stats:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://movies:movies@postgres:5432/movies
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movies-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  reviews:
    build:
      context: ./services/reviews
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://movies:movies@postgres:5432/movies
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movies-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://movies:movies@postgres:5432/movies
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movies-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      stats:
        condition: service_healthy
      reviews:
        condition: service_healthy
      users:
        condition: service_healthy
    networks:
      - movies-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  movies-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local