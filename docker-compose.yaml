services:
  # Main application container – NOT exposed to host directly;
  # it is only reachable via the gateway (which enforces the bounded queue).
  # If you need direct access for debugging, uncomment the ports mapping.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movies-app
    expose:
      - "8000"
    # ports:          # uncomment for direct debugging
    #   - "8000:8000"
    networks:
      - movies-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Gateway / reverse-proxy with bounded request queue (pre-built nginx).
  # This is the ONLY service exposed to the host.  All /movies/* traffic
  # goes through nginx limit_conn (2) + limit_req burst (5) before being forwarded to `app`.
  # Other paths (/, /health, /users/*, /queue/stats) are proxied without queueing.
  # Open-source nginx uses burst as queue; nginx Plus would use `queue 5 timeout=10s` in upstream.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: movies-gateway
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - movies-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/gateway/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  movies-net:
    driver: bridge
